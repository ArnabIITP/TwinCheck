name: Prepare GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-prepare:
    name: Build, verify and prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}; expected {expected!r}")
          PY
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build --outdir dist
      - name: Verify package metadata, contents and isolated installation
        run: python scripts/verify_distribution.py --dist-dir dist
      - name: Create draft GitHub Release with verified artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
