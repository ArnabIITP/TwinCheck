name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and schema-validation test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python -m twincheck --help
      - name: Verify versioned stateful regression corpus
        run: python benchmarks/verify_stateful_corpus.py --output-dir "${{ runner.temp }}/twincheck-stateful-corpus-v2"
      - name: Compare static and adaptive exploration on the pinned fixture
        run: >-
          python benchmarks/compare_exploration_modes.py
          --case stateful-read-ordering
          --seed 19
          --max-cases 12
          --max-run-seconds 60
          --minimization-trials 12
          --output "${{ runner.temp }}/twincheck-stateful-corpus-v2/exploration-mode-comparison.json"
      - name: Run paired multi-case static/adaptive exploration protocol
        run: >-
          python benchmarks/run_exploration_protocol.py
          --rounds 2
          --max-run-seconds 20
          --output "${{ runner.temp }}/twincheck-stateful-corpus-v2/exploration-protocol-v1.json"
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir "${{ runner.temp }}/twincheck-dist"
      - name: Verify distribution from an isolated environment
        run: python scripts/verify_distribution.py --dist-dir "${{ runner.temp }}/twincheck-dist"
      - name: Upload verified release candidate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: twincheck-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/twincheck-dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twincheck-synthetic-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/twincheck-stateful-corpus-v2
          if-no-files-found: ignore
          retention-days: 14
