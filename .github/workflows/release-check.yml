name: Release candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build --outdir dist
      - name: Check metadata and verify isolated installation
        run: python scripts/verify_distribution.py --dist-dir dist
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twincheck-release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
