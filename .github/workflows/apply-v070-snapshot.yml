name: Verify and apply v0.7 source snapshot

on:
  push:
    branches:
      - feat/v0.7-stateful-regression-packs
    paths:
      - ".sync-parts/**"
      - ".github/workflows/apply-v070-snapshot.yml"

permissions:
  contents: write

jobs:
  verify-source:
    name: Verify snapshot on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/TwinCheck-v070-source.tar.xz"
          cat .sync-parts/part-*.bin > "$archive"
          echo "6d6f414668529c537b94ec960c623a382cc0919e3b1419332cc385e7ed8436d2  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/source"
          tar -xJf "$archive" -C "$RUNNER_TEMP/source"
      - name: Install project
        working-directory: ${{ runner.temp }}/source
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run full standard-library test suite
        working-directory: ${{ runner.temp }}/source
        run: python -m unittest discover -s tests -v
      - name: Verify package version and CLI
        working-directory: ${{ runner.temp }}/source
        run: |
          python -m twincheck --version
          python -m twincheck --help
      - name: Validate committed JSON documents
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          set -euo pipefail
          find docs examples -type f -name '*.json' -print0 | while IFS= read -r -d '' f; do
            python -m json.tool "$f" >/dev/null
          done

  apply-snapshot:
    name: Apply tested source snapshot
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Set up rsync
        run: command -v rsync >/dev/null
      - name: Reconstruct and apply tested source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/TwinCheck-v070-source.tar.xz"
          cat .sync-parts/part-*.bin > "$archive"
          echo "6d6f414668529c537b94ec960c623a382cc0919e3b1419332cc385e7ed8436d2  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/source"
          tar -xJf "$archive" -C "$RUNNER_TEMP/source"
          rsync -a --delete --exclude='.git/' --exclude='.sync-parts/' --exclude='.github/workflows/apply-v070-snapshot.yml' "$RUNNER_TEMP/source/" ./
          rm -rf .sync-parts
          rm -f .github/workflows/apply-v070-snapshot.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add TwinCheck v0.7 stateful regression packs"
          git push origin HEAD:"$GITHUB_REF_NAME"
