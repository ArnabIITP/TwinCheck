name: One-time v0.9 branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-v09-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Delete the merged development branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "feat/v0.9-regression-corpus"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-v09-branch-cleanup.yml
          git commit -m "chore: remove temporary v0.9 branch cleanup workflow"
          git push origin HEAD:main
